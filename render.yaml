services:
  - type: web
    name: fieldops-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fieldops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '60'
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: fieldops-db
    plan: free
    region: frankfurt
    databaseName: fieldops
    user: fieldops
    postgresMajorVersion: '17'
    ipAllowList: []
